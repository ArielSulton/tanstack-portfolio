name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, test, typecheck, build, and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Read Netlify runtime versions
        id: runtime
        run: |
          bun -e '
          import { appendFileSync } from "node:fs";
          const runtime = Bun.TOML.parse(await Bun.file("netlify.toml").text()).build.environment;
          if (Bun.version !== runtime.BUN_VERSION) {
            throw new Error("packageManager must match BUN_VERSION in netlify.toml");
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `node=${runtime.NODE_VERSION}\n`);
          '

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.runtime.outputs.node }}
          package-manager-cache: false

      - name: Install from the lockfile
        run: bun install --frozen-lockfile

      - name: Run regression tests
        run: bun run test

      - name: Check TypeScript
        run: bun run typecheck

      - name: Build production client and SSR
        run: bun run build

      - name: Audit all dependencies
        run: bun run audit
