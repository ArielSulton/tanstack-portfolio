<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F5B4A"/>
      <stop offset="1" stop-color="#1FA88A"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="184"/></clipPath>
    <filter id="tile-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12" result="b"/>
      <feFlood flood-color="#02201A" flood-opacity="0.38"/>
      <feComposite in2="b" operator="in"/>
    </filter>
    <filter id="glyph-shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="14" result="b"/>
      <feFlood flood-color="#02201A" flood-opacity="0.35"/>
      <feComposite in2="b" operator="in"/>
    </filter>
  </defs>

  <!-- bayangan tile -->
  <rect x="100" y="100" width="824" height="824" rx="184" filter="url(#tile-shadow)"/>
  <!-- tile + gradien -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <!-- kilau kaca di bagian atas -->
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="371" fill="url(#gloss)"/>
  </g>
  <!-- tepi dalam halus -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="182.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
